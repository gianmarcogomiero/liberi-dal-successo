<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 80% 55% at 18% -8%, rgba(175,198,233,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 88% 108%, rgba(196,169,98,0.10) 0%, transparent 52%),
      #0B1C2D;
    color:#D9CFC3; font-family:'DM Sans',sans-serif; position:relative;
  }
  .frame { position:absolute; inset:24px; border:1px solid rgba(196,169,98,0.30); border-radius:18px; }
  .wrap { position:relative; height:100%; padding:64px 80px 56px; display:flex; flex-direction:column; }

  .top { text-align:center; }
  .logo { width:82px; height:82px; display:block; margin:0 auto 16px; }
  .brand { font-size:14px; letter-spacing:6px; text-transform:uppercase; color:#AFC6E9; font-weight:600; }
  h1 { font-family:'Playfair Display',serif; font-weight:700; font-size:50px; line-height:1.12; color:#D9CFC3; text-align:center; margin-top:18px; }
  .sub { text-align:center; font-size:19px; line-height:1.6; color:rgba(217,207,195,0.6); max-width:560px; margin:16px auto 0; }
  .rule { width:64px; height:2px; background:linear-gradient(90deg,transparent,#C4A962,transparent); margin:26px auto 0; }

  .grid { margin-top:30px; flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:26px 40px; align-items:center; }
  .person { text-align:center; }
  .pph { width:248px; height:248px; border-radius:50%; object-fit:cover; border:1px solid rgba(175,198,233,0.4); box-shadow:0 0 0 7px rgba(175,198,233,0.05); }
  .pname { font-family:'Playfair Display',serif; font-size:32px; color:#D9CFC3; margin-top:20px; }
  .prole { font-size:15px; letter-spacing:2.5px; text-transform:uppercase; color:#C4A962; font-weight:600; margin-top:7px; }

  .foot { text-align:center; margin-top:24px; }
  .foot .place { font-size:19px; color:rgba(217,207,195,0.78); font-weight:500; }
  .foot .site { font-size:18px; color:#C4A962; font-weight:600; letter-spacing:2px; margin-top:12px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="top">
      <img class="logo" src="Loghi/colorato%201.png" alt="" />
      <div class="brand">Liberi dal Successo · 20 Giugno 2026</div>
      <h1>Le persone che daranno<br />vita alla serata</h1>
      <div class="rule"></div>
    </div>

    <div class="grid">
      <div class="person">
        <img class="pph" src="people/giulia-lazzaretto.jpg" alt="" />
        <div class="pname">Giulia Lazzaretto</div>
        <div class="prole">Presentatrice</div>
      </div>
      <div class="person">
        <img class="pph" src="people/agnese-ardolino.jpg" alt="" />
        <div class="pname">Agnese Ardolino</div>
        <div class="prole">Violino</div>
      </div>
      <div class="person">
        <img class="pph" src="people/stefano-canton.jpg" alt="" />
        <div class="pname">Stefano Canton</div>
        <div class="prole">Clarinetto</div>
      </div>
      <div class="person">
        <img class="pph" src="people/giacomo-gomiero.jpg" alt="" />
        <div class="pname">Giacomo Gomiero</div>
        <div class="prole">Chitarra acustica</div>
      </div>
    </div>

    <div class="foot">
      <div class="place">Sala Polivalente · Bresseo, Teolo (PD)</div>
      <div class="site">liberidalsuccesso.it</div>
    </div>
  </div>
</body>
</html>
